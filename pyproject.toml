[project]
name = "a4ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "herreramaxi", email = "herreramaxi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepdiff>=9.2.1",
    "discoveryworld",
    "dotenv>=0.9.9",
    "faststream[rabbit]>=0.7.9",
    "imageio-ffmpeg>=0.8.1",
    "kombu>=5.7.0",
    "langchain>=1.4.9",
    "langchain-deepseek>=1.2.1",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.7.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.50.0",
    "pandas>=3.1.1",
    "pathfinding>=1.0.23",
    "psutil>=7.2.2",
    "pyarrow>=26.0.1",
    "pygame>=2.6.1",
    "pysqlite3>=0.6.2",
    "termcolor>=3.3.0",
    "tiktoken>=0.14.0",
    "typesafe-sdk>=0.7.5",
]

[tool.uv.sources]
discoveryworld = { git = "https://github.com/herreramaxi/discoveryworld.git", rev = "3b8166fa2316db535f8d8c5ac67641ac4fde6da5" }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
